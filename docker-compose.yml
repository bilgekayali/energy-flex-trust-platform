services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flextrust
      POSTGRES_USER: flextrust
      POSTGRES_PASSWORD: flextrust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flextrust -d flextrust"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://flextrust:flextrust@postgres:5432/flextrust
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:

