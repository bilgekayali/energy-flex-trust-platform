name: PostgreSQL Recovery Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_DB: flextrust
          POSTGRES_USER: flextrust
          POSTGRES_PASSWORD: flextrust-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flextrust -d flextrust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://flextrust:flextrust-ci-only@127.0.0.1:5432/flextrust
      PGPASSWORD: flextrust-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Upgrade primary database
        run: alembic upgrade head
      - name: Seed deterministic recovery fixture
        run: python scripts/recovery_drill.py seed --output recovery-expected.json
      - name: Create and verify least-privilege runtime roles
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            psql \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname flextrust \
              --set ON_ERROR_STOP=1 \
              --command "CREATE ROLE flextrust_migrator NOLOGIN;" \
              --command "CREATE ROLE flextrust_api LOGIN PASSWORD 'api-ci-only';" \
              --command "CREATE ROLE flextrust_worker LOGIN PASSWORD 'worker-ci-only';" \
              --command "CREATE ROLE flextrust_recovery LOGIN PASSWORD 'recovery-ci-only';" \
              --command "CREATE ROLE flextrust_auditor LOGIN PASSWORD 'auditor-ci-only';"
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/deploy/postgres/least_privilege.sql:/work/grants.sql:ro" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            psql \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname flextrust \
              --set ON_ERROR_STOP=1 \
              --file /work/grants.sql
          python scripts/verify_db_privileges.py --database flextrust
      - name: Dump primary database with matching PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            pg_dump \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname flextrust \
              --format custom \
              --no-owner \
              --no-acl > recovery.dump
          test -s recovery.dump
      - name: Restore into an isolated database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            psql \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --command 'CREATE DATABASE flextrust_restore;'
          docker run --rm --network host -i \
            -e PGPASSWORD="$PGPASSWORD" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            pg_restore \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname flextrust_restore \
              --exit-on-error < recovery.dump
      - name: Verify restored audit, evidence and outbox state
        env:
          DATABASE_URL: postgresql+psycopg://flextrust:flextrust-ci-only@127.0.0.1:5432/flextrust_restore
        run: python scripts/recovery_drill.py verify --input recovery-expected.json
      - name: Exercise full migration rollback on an empty probe database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            "postgres:${{ matrix.postgres-version }}-alpine" \
            psql \
              --host 127.0.0.1 \
              --username flextrust \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --command 'CREATE DATABASE flextrust_migration_probe;'
          export DATABASE_URL='postgresql+psycopg://flextrust:flextrust-ci-only@127.0.0.1:5432/flextrust_migration_probe'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python - <<'PY'
          import os
          from energy_flex_trust.database import build_engine, initialize_database

          engine = build_engine(os.environ["DATABASE_URL"])
          try:
              initialize_database(engine, managed=True)
          finally:
              engine.dispose()
          PY
