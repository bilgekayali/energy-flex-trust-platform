name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  runtime-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and audit tool
        run: |
          python -m pip install .
          python -m pip install pip-audit==2.10.1
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify bounded advisory exception scope
        run: |
          python scripts/verify_advisory_exceptions.py
          python - <<'PY'
          from importlib import metadata

          version = metadata.version("cryptography")
          if not version.startswith("49."):
              raise SystemExit(
                  f"expected patched released cryptography 49.x, found {version}"
              )
          PY
      - name: Audit installed runtime environment
        run: >-
          pip-audit --local --skip-editable
          --ignore-vuln PYSEC-2026-3552

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
