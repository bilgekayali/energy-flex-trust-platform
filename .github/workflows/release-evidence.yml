name: Release Evidence

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Derive reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "build>=1,<2"
          python -m build --wheel
      - name: Resolve wheel path
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX 2.3 runtime SBOM
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --disable-pip-version-check \
            "${{ steps.artifact.outputs.wheel }}"
          .sbom-venv/bin/python scripts/generate_sbom.py \
            --output dist/energy-flex-trust.spdx.json
          .sbom-venv/bin/python - <<'PY'
          import energy_flex_trust

          if energy_flex_trust.__version__ != "1.0.0":
              raise SystemExit(
                  f"unexpected package version: {energy_flex_trust.__version__}"
              )
          PY
      - name: Generate artifact digests
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum ./*.whl energy-flex-trust.spdx.json > SHA256SUMS
          )
      - name: Build hardened container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION=1.0.0 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "energy-flex-trust:${GITHUB_SHA}" \
            .
          test "$(docker inspect --format '{{.Config.User}}' "energy-flex-trust:${GITHUB_SHA}")" = "10001:10001"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "energy-flex-trust:${GITHUB_SHA}" \
            python -c 'import energy_flex_trust; assert energy_flex_trust.__version__ == "1.0.0"'
      - name: Generate exact release record
        shell: bash
        env:
          WHEEL_PATH: ${{ steps.artifact.outputs.wheel }}
        run: |
          set -euo pipefail
          export CONTAINER_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "energy-flex-trust:${GITHUB_SHA}")"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          wheel = Path(os.environ["WHEEL_PATH"])
          sbom = Path("dist/energy-flex-trust.spdx.json")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          record = {
              "record_version": "energy-flex-release-record.v1",
              "release_version": "1.0.0",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "wheel": {"name": wheel.name, "sha256": sha256(wheel)},
              "sbom": {"name": sbom.name, "sha256": sha256(sbom)},
              "container_image_id": os.environ["CONTAINER_IMAGE_ID"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
          }
          Path("dist/RELEASE_RECORD.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            dist/*.whl
            dist/energy-flex-trust.spdx.json
            dist/SHA256SUMS
            dist/RELEASE_RECORD.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest wheel provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.wheel }}
      - name: Attest wheel SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.wheel }}
          sbom-path: dist/energy-flex-trust.spdx.json
