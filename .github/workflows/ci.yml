name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . --output-format=github
      - name: Compile
        run: python -m compileall -q src tests migrations
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest.log
      - name: Annotate pytest failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pytest.log")
          if path.exists():
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              text = "\n".join(lines[-120:])
              text = text.replace("%", "%25")
              text = text.replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest failure::{text}")
          PY
      - name: OIDC verifier network boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          blocked = {"httpx", "requests", "socket", "urllib"}
          tree = ast.parse(Path("src/energy_flex_trust/auth.py").read_text())
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split(".")[0])
          forbidden = sorted(imports & blocked)
          if forbidden:
              raise SystemExit(f"network-capable imports in auth boundary: {forbidden}")
          PY
